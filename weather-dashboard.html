<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 1200px;
      width: 100%;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .search-section {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .search-box {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    button {
      padding: 12px 25px;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    button:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    button:active {
      transform: translateY(0);
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 1.2rem;
      padding: 40px;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .weather-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }

    .current-weather {
      grid-column: 1 / -1;
    }

    .current-weather .city-name {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    .current-weather .coordinates {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 20px;
    }

    .weather-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .temp-section {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .temperature {
      font-size: 3.5rem;
      font-weight: bold;
      color: #667eea;
    }

    .unit-toggle {
      display: flex;
      gap: 5px;
      margin-left: 20px;
    }

    .unit-toggle button {
      padding: 8px 12px;
      font-size: 0.9rem;
      background: #f0f0f0;
      color: #333;
    }

    .unit-toggle button.active {
      background: #667eea;
      color: white;
    }

    .weather-icon {
      font-size: 4rem;
    }

    .weather-description {
      font-size: 1.1rem;
      color: #666;
      text-transform: capitalize;
      margin-bottom: 20px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .detail {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid #667eea;
    }

    .detail-label {
      font-size: 0.85rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 1.3rem;
      font-weight: bold;
      color: #333;
    }

    .forecast {
      grid-column: 1 / -1;
    }

    .forecast h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 1.3rem;
    }

    .forecast-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 0;
    }

    .forecast-item {
      flex: 0 0 120px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .forecast-time {
      font-size: 0.85rem;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .forecast-icon {
      font-size: 2rem;
      margin: 8px 0;
    }

    .forecast-temp {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .no-data {
      text-align: center;
      color: white;
      padding: 40px;
      font-size: 1.1rem;
    }

    .favorites {
      margin-bottom: 30px;
    }

    .favorites h2 {
      color: white;
      margin-bottom: 15px;
      font-size: 1.3rem;
    }

    .favorites-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .favorite-btn {
      padding: 8px 15px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid white;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .favorite-btn:hover {
      background: white;
      color: #667eea;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }

      .temperature {
        font-size: 2.5rem;
      }

      .weather-grid {
        grid-template-columns: 1fr;
      }

      .search-box {
        flex-direction: column;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }
    }

    .api-note {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌤️ Weather Dashboard</h1>
      <p style="color: rgba(255, 255, 255, 0.8);">Real-time weather for any location</p>
    </header>

    <div class="search-section">
      <div class="search-box">
        <input 
          type="text" 
          id="cityInput" 
          placeholder="Enter city name..." 
          autocomplete="off"
        >
        <button onclick="searchWeather()">Search</button>
      </div>
    </div>

    <div class="favorites">
      <h2>Favorites</h2>
      <div class="favorites-list" id="favoritesList">
        <p style="color: rgba(255, 255, 255, 0.7); font-size: 0.9rem;">Search for a city to add favorites</p>
      </div>
    </div>

    <div id="content">
      <div class="no-data">Enter a city name to get started</div>
    </div>

    <div class="api-note">
      📍 Data from Open-Meteo API (free, no API key required)
    </div>
  </div>

  <script>
    const cityInput = document.getElementById('cityInput');
    const contentDiv = document.getElementById('content');
    const favoritesList = document.getElementById('favoritesList');
    let currentUnit = 'C'; // Celsius by default
    let currentWeatherData = null;
    let favorites = JSON.parse(localStorage.getItem('weatherFavorites')) || [];

    // Handle Enter key
    cityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchWeather();
      }
    });

    function showLoading() {
      contentDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    }

    function showError(message) {
      contentDiv.innerHTML = `<div class="error">${message}</div>`;
    }

    async function getCoordinates(city) {
      try {
        const response = await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
        );
        const data = await response.json();
        
        if (!data.results || data.results.length === 0) {
          showError(`City "${city}" not found. Please try another search.`);
          return null;
        }
        
        const result = data.results[0];
        return {
          name: result.name,
          country: result.country,
          lat: result.latitude,
          lon: result.longitude
        };
      } catch (error) {
        showError('Error fetching location data: ' + error.message);
        return null;
      }
    }

    async function getWeather(lat, lon, cityName, country) {
      try {
        const response = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto`
        );
        const data = await response.json();
        
        currentWeatherData = {
          city: cityName,
          country: country,
          lat: lat,
          lon: lon,
          current: data.current,
          hourly: data.hourly,
          daily: data.daily,
          timezone: data.timezone
        };
        
        displayWeather();
      } catch (error) {
        showError('Error fetching weather data: ' + error.message);
      }
    }

    function getWeatherIcon(code) {
      // WMO Weather interpretation codes
      if (code === 0) return '☀️';
      if (code === 1 || code === 2) return '🌤️';
      if (code === 3) return '☁️';
      if (code === 45 || code === 48) return '🌫️';
      if (code === 51 || code === 53 || code === 55) return '🌧️';
      if (code === 61 || code === 63 || code === 65) return '🌧️';
      if (code === 71 || code === 73 || code === 75) return '❄️';
      if (code === 77) return '❄️';
      if (code === 80 || code === 81 || code === 82) return '🌧️';
      if (code === 85 || code === 86) return '❄️';
      if (code === 95 || code === 96 || code === 99) return '⛈️';
      return '🌡️';
    }

    function getWeatherDescription(code) {
      const descriptions = {
        0: 'Clear sky',
        1: 'Mainly clear',
        2: 'Partly cloudy',
        3: 'Overcast',
        45: 'Foggy',
        48: 'Depositing rime fog',
        51: 'Light drizzle',
        53: 'Moderate drizzle',
        55: 'Dense drizzle',
        61: 'Slight rain',
        63: 'Moderate rain',
        65: 'Heavy rain',
        71: 'Slight snow',
        73: 'Moderate snow',
        75: 'Heavy snow',
        77: 'Snow grains',
        80: 'Slight rain showers',
        81: 'Moderate rain showers',
        82: 'Violent rain showers',
        85: 'Slight snow showers',
        86: 'Heavy snow showers',
        95: 'Thunderstorm',
        96: 'Thunderstorm with slight hail',
        99: 'Thunderstorm with heavy hail'
      };
      return descriptions[code] || 'Unknown';
    }

    function convertTemp(celsius) {
      if (currentUnit === 'F') {
        return Math.round((celsius * 9/5) + 32);
      }
      return Math.round(celsius);
    }

    function getTempUnit() {
      return currentUnit === 'C' ? '°C' : '°F';
    }

    function displayWeather() {
      if (!currentWeatherData) return;

      const { city, country, current, hourly, daily, timezone } = currentWeatherData;
      const temp = convertTemp(current.temperature_2m);
      const feelsLike = convertTemp(current.apparent_temperature);
      const icon = getWeatherIcon(current.weather_code);
      const description = getWeatherDescription(current.weather_code);

      // Get forecast for next 5 days
      let forecastHTML = '';
      for (let i = 0; i < Math.min(5, daily.time.length); i++) {
        const date = new Date(daily.time[i]);
        const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
        const maxTemp = convertTemp(daily.temperature_2m_max[i]);
        const minTemp = convertTemp(daily.temperature_2m_min[i]);
        const dayIcon = getWeatherIcon(daily.weather_code[i]);
        
        forecastHTML += `
          <div class="forecast-item">
            <div class="forecast-time">${dayName}</div>
            <div class="forecast-icon">${dayIcon}</div>
            <div class="forecast-temp">${maxTemp}° / ${minTemp}°</div>
          </div>
        `;
      }

      contentDiv.innerHTML = `
        <div class="weather-grid">
          <div class="card current-weather">
            <div class="city-name">${city}, ${country}</div>
            <div class="coordinates">📍 ${currentWeatherData.lat.toFixed(2)}°, ${currentWeatherData.lon.toFixed(2)}°</div>
            
            <div class="weather-main">
              <div>
                <div class="temp-section">
                  <div class="temperature">${temp}${getTempUnit()}</div>
                  <div class="unit-toggle">
                    <button onclick="setUnit('C')" class="unit-btn ${currentUnit === 'C' ? 'active' : ''}">°C</button>
                    <button onclick="setUnit('F')" class="unit-btn ${currentUnit === 'F' ? 'active' : ''}">°F</button>
                  </div>
                </div>
                <div class="weather-description">${description}</div>
              </div>
              <div class="weather-icon">${icon}</div>
            </div>

            <div class="details-grid">
              <div class="detail">
                <div class="detail-label">Feels Like</div>
                <div class="detail-value">${feelsLike}${getTempUnit()}</div>
              </div>
              <div class="detail">
                <div class="detail-label">Humidity</div>
                <div class="detail-value">${current.relative_humidity_2m}%</div>
              </div>
              <div class="detail">
                <div class="detail-label">Wind Speed</div>
                <div class="detail-value">${current.wind_speed_10m} km/h</div>
              </div>
              <div class="detail">
                <div class="detail-label">Timezone</div>
                <div class="detail-value">${timezone}</div>
              </div>
            </div>
          </div>

          <div class="card forecast">
            <h2>5-Day Forecast</h2>
            <div class="forecast-container">
              ${forecastHTML}
            </div>
          </div>
        </div>
      `;

      updateFavoriteButton();
    }

    function setUnit(unit) {
      currentUnit = unit;
      if (currentWeatherData) {
        displayWeather();
      }
    }

    async function searchWeather() {
      const city = cityInput.value.trim();
      if (!city) {
        showError('Please enter a city name');
        return;
      }

      showLoading();
      const coords = await getCoordinates(city);
      if (coords) {
        await getWeather(coords.lat, coords.lon, coords.name, coords.country);
      }
    }

    function addToFavorites() {
      if (!currentWeatherData) return;
      
      const fav = {
        city: currentWeatherData.city,
        country: currentWeatherData.country,
        lat: currentWeatherData.lat,
        lon: currentWeatherData.lon
      };

      if (!favorites.some(f => f.lat === fav.lat && f.lon === fav.lon)) {
        favorites.push(fav);
        localStorage.setItem('weatherFavorites', JSON.stringify(favorites));
        displayFavorites();
        updateFavoriteButton();
      }
    }

    function removeFromFavorites(lat, lon) {
      favorites = favorites.filter(f => !(f.lat === lat && f.lon === lon));
      localStorage.setItem('weatherFavorites', JSON.stringify(favorites));
      displayFavorites();
      if (currentWeatherData && currentWeatherData.lat === lat && currentWeatherData.lon === lon) {
        updateFavoriteButton();
      }
    }

    function displayFavorites() {
      if (favorites.length === 0) {
        favoritesList.innerHTML = '<p style="color: rgba(255, 255, 255, 0.7); font-size: 0.9rem;">No favorites yet. Add one!</p>';
        return;
      }

      favoritesList.innerHTML = favorites.map(fav => `
        <button class="favorite-btn" onclick="loadFavorite(${fav.lat}, ${fav.lon})">
          ${fav.city}, ${fav.country}
        </button>
      `).join('');
    }

    async function loadFavorite(lat, lon) {
      showLoading();
      const fav = favorites.find(f => f.lat === lat && f.lon === lon);
      if (fav) {
        await getWeather(lat, lon, fav.city, fav.country);
      }
    }

    function updateFavoriteButton() {
      if (!currentWeatherData) return;
      
      const isFavorite = favorites.some(f => 
        f.lat === currentWeatherData.lat && f.lon === currentWeatherData.lon
      );

      // Add favorite button to the header if it doesn't exist
      const existingBtn = document.querySelector('.favorite-action-btn');
      if (existingBtn) {
        existingBtn.textContent = isFavorite ? '⭐ Remove from Favorites' : '☆ Add to Favorites';
        existingBtn.onclick = () => {
          if (isFavorite) {
            removeFromFavorites(currentWeatherData.lat, currentWeatherData.lon);
          } else {
            addToFavorites();
          }
        };
      }
    }

    // Load favorites on page load
    displayFavorites();

    // Add favorite button to search section
    document.querySelector('.search-section').innerHTML += `
      <button class="favorite-action-btn" style="display: none;">☆ Add to Favorites</button>
    `;

    // Show favorite button when weather is loaded
    const originalDisplay = displayWeather;
    displayWeather = function() {
      originalDisplay.call(this);
      document.querySelector('.favorite-action-btn').style.display = 'block';
    };
  </script>
</body>
</html>
